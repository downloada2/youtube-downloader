<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<style>
@font-face { font-family: "Manrope"; src: url("fonts/manrope.ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "Unbounded"; src: url("fonts/unbounded.ttf") format("truetype"); font-weight: 200 900; }

:root {
  --bg: #07060F; --panel: rgba(20,18,42,.72); --sheet: #151329;
  --over-1: rgba(255,255,255,.06); --over-2: rgba(255,255,255,.12); --over-3: rgba(255,255,255,.24);
  --shadow: rgba(0,0,0,.45);
  --text-hi: #F6F4FF; --text-mid: #B7B2D3; --text-low: #7D789C;
  --accent-text: #C9BBFF; --danger: #FF8FA3;
  --title-a: #FFFFFF; --title-b: #C9BBFF;
  --violet: #8B5CF6; --indigo: #5B5BF7; --pink: #FF4D9D; --cyan: #22D3EE; --mint: #34D399; --amber: #FFB020; --coral: #FF6B4A; --red: #FF4D6A;
  --g1: var(--indigo); --g2: var(--violet); --g3: var(--pink); --glow: 139,92,246;
  --aurora: 1; --radius: 26px;
}
body.classic {
  --bg: #F5F2FC; --panel: rgba(255,255,255,.86); --sheet: #FFFFFF;
  --over-1: rgba(42,31,92,.04); --over-2: rgba(42,31,92,.08); --over-3: rgba(42,31,92,.14);
  --shadow: rgba(40,20,90,.14);
  --text-hi: #1C1736; --text-mid: #575173; --text-low: #8B86A6;
  --accent-text: #6D4AFF; --danger: #D12C4A;
  --title-a: #1C1736; --title-b: #6D4AFF;
  --aurora: .45;
}
body.m-video { --g1: var(--pink); --g2: var(--coral); --g3: var(--amber); --glow: 255,107,74; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text-hi); font: 500 14px/1.45 "Manrope", -apple-system, "Segoe UI", sans-serif;
  overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; transition: background .3s; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--over-2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- aurora ---------- */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--aurora); }
.aurora i { position: absolute; border-radius: 50%; filter: blur(10px); }
.aurora .b1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(circle, rgba(139,92,246,.42), transparent 62%); animation: drift1 26s ease-in-out infinite; }
.aurora .b2 { width: 55vmax; height: 55vmax; right: -22vmax; top: 10vh; background: radial-gradient(circle, rgba(255,77,157,.24), transparent 62%); animation: drift2 31s ease-in-out infinite; }
.aurora .b3 { width: 60vmax; height: 60vmax; left: -10vmax; bottom: -38vmax; background: radial-gradient(circle, rgba(34,211,238,.20), transparent 62%); animation: drift3 23s ease-in-out infinite; }
.aurora .b4 { width: 40vmax; height: 40vmax; left: 45vw; top: -24vmax; background: radial-gradient(circle, rgba(91,91,247,.24), transparent 62%); animation: drift2 37s ease-in-out infinite reverse; }
@keyframes drift1 { 50% { transform: translate(12vw, 6vh); } }
@keyframes drift2 { 50% { transform: translate(-8vw, 10vh); } }
@keyframes drift3 { 50% { transform: translate(14vw, -6vh); } }

/* ---------- layout ---------- */
.app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 14px; padding: 16px 32px 4px; }
.brand-logo { width: 46px; height: 46px; flex: none; }
.brand-name { font: 700 16px/1.15 "Unbounded", sans-serif; letter-spacing: -.01em;
  background: linear-gradient(180deg, var(--title-a), var(--title-b)); -webkit-background-clip: text; color: transparent; }
.brand-sub { font-size: 11.5px; color: var(--text-low); margin-top: 3px; }
.spacer { flex: 1; }
.theme { display: flex; padding: 4px; gap: 4px; border-radius: 16px; background: var(--over-1); box-shadow: inset 0 0 0 1px var(--over-2); }
.theme button { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; color: var(--text-mid); transition: background .2s, color .2s; }
.theme button svg { width: 16px; height: 16px; }
.theme button.on { color: #fff; background: linear-gradient(100deg, var(--indigo), var(--violet) 55%, var(--pink)); box-shadow: 0 6px 16px -6px rgba(139,92,246,.8), inset 0 1px 0 rgba(255,255,255,.4); }
.home { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(440px, 1.1fr) minmax(360px, 1fr); gap: 22px; padding: 10px 32px 22px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
.col.left { padding-right: 2px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 2px 8px 6px 2px; margin-right: -6px; }
.btn-big { flex: none; }

/* ---------- glass / buttons ---------- */
.glass { position: relative; border-radius: var(--radius); background: var(--panel);
  background-image: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  box-shadow: 0 14px 40px -10px var(--shadow), inset 0 1px 0 var(--over-3), inset 0 0 0 1px var(--over-1);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
body.classic .glass { background-image: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 46px; padding: 0 20px; border-radius: 15px; font-weight: 800; transition: transform .15s cubic-bezier(.3,1.6,.6,1), filter .2s; white-space: nowrap; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn:active { transform: scale(.95); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-brand { color: #fff; background: linear-gradient(100deg, var(--g1), var(--g2) 50%, var(--g3));
  box-shadow: 0 10px 26px -8px rgba(var(--glow),.75), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.18); position: relative; overflow: hidden; }
.btn-brand:hover { filter: brightness(1.1); }
.btn-brand::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22%; left: -30%; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); animation: sweep 3.8s linear infinite; }
@keyframes sweep { to { left: 130%; } }
.btn-glass { background: var(--over-1); box-shadow: inset 0 0 0 1px var(--over-2), inset 0 1px 0 var(--over-2); color: var(--text-hi); }
.btn-glass:hover { background: var(--over-2); }
.btn-sm { height: 36px; padding: 0 14px; border-radius: 12px; font-size: 13px; }
.btn-big { height: 56px; font-size: 17px; border-radius: 20px; width: 100%; letter-spacing: .01em; }
.icon-btn { width: 34px; height: 34px; border-radius: 11px; display: inline-grid; place-items: center; color: var(--text-mid); transition: background .2s, color .2s, transform .15s; }
.icon-btn:hover { background: var(--over-2); color: var(--text-hi); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------- orbs ---------- */
.orb { position: relative; flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff;
  background: radial-gradient(circle at 30% 22%, color-mix(in srgb, var(--c) 58%, white), var(--c) 45%, color-mix(in srgb, var(--c) 50%, black) 100%);
  box-shadow: 0 8px 18px -4px color-mix(in srgb, var(--c) 60%, transparent), inset 0 1px 1px rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.25); }
.orb::after { content: ""; position: absolute; left: 16%; top: 5%; width: 68%; height: 44%; border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events: none; }
.orb.gem { border-radius: 32%; } .orb.gem::after { border-radius: 40%; }
.orb svg { position: relative; z-index: 1; width: 52%; height: 52%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }

/* ---------- hero ---------- */
.hero { padding: 16px 22px 14px; }
.hero .stack { zoom: .78; margin: -6px 0; }
.hero-top { display: flex; gap: 20px; align-items: center; }
.stack { width: 126px; height: 150px; flex: none; perspective: 600px; position: relative; }
.stack .slab { position: absolute; left: 20px; top: 62px; width: 84px; height: 84px; border-radius: 22px;
  transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-45deg) translateZ(calc(var(--i) * 20px));
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 55%, white), var(--c) 60%, color-mix(in srgb, var(--c) 55%, black));
  box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset, 0 6px 0 color-mix(in srgb, var(--c) 45%, black), 0 14px 26px -6px color-mix(in srgb, var(--c) 80%, transparent);
  animation: breathe 7s ease-in-out infinite; animation-delay: calc(var(--i) * -.35s); transition: background .4s; }
.stack .slab::before { content: ""; position: absolute; inset: 30% 16%; border-radius: 6px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.7) 0 3px, transparent 3px 8px);
  -webkit-mask: linear-gradient(0deg, transparent, #000 30%, #000 70%, transparent); opacity: .55; }
@keyframes breathe { 50% { transform: rotateX(58deg) rotateZ(-45deg) translateZ(calc(var(--i) * 25px)); } }
.stack .ground { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 32px; border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), transparent); }
body.m-audio .stack .slab:nth-child(1) { --c: var(--cyan); } body.m-audio .stack .slab:nth-child(2) { --c: var(--violet); } body.m-audio .stack .slab:nth-child(3) { --c: var(--pink); }
body.m-video .stack .slab:nth-child(1) { --c: var(--pink); } body.m-video .stack .slab:nth-child(2) { --c: var(--coral); } body.m-video .stack .slab:nth-child(3) { --c: var(--amber); }
.hero h1 { font: 700 19px/1.18 "Unbounded", sans-serif; letter-spacing: -.02em; margin: 0 0 8px;
  background: linear-gradient(180deg, var(--title-a), var(--title-b)); -webkit-background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--text-mid); }
.yt { display: flex; gap: 8px; margin-top: 12px; }
.field { flex: 1; min-width: 0; height: 48px; border-radius: 15px; padding: 0 16px; border: 0; outline: 0;
  background: var(--over-1); box-shadow: inset 0 0 0 1px var(--over-2); color: var(--text-hi); user-select: text; transition: box-shadow .2s; }
.field:focus { box-shadow: inset 0 0 0 2px var(--g2); }
.field::placeholder { color: var(--text-low); }
.field.bad { box-shadow: inset 0 0 0 2px var(--red); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hint { font-size: 12.5px; color: var(--text-low); margin-top: 8px; }
.hint:empty { display: none; }

/* ---------- modes ---------- */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mode { padding: 12px 16px; text-align: left; display: flex; gap: 14px; align-items: center; transition: transform .18s cubic-bezier(.3,1.6,.6,1), box-shadow .25s; }
.mode:hover { transform: translateY(-3px); }
.mode:active { transform: scale(.97); }
.mode .orb { width: 44px; height: 44px; }
.mode b { display: block; font: 700 15px "Unbounded", sans-serif; letter-spacing: -.01em; }
.mode small { color: var(--text-mid); font-size: 12.5px; line-height: 1.3; display: block; margin-top: 3px; }
.mode.on { box-shadow: 0 20px 40px -12px var(--shadow), 0 0 0 2px var(--c), 0 0 28px -4px color-mix(in srgb, var(--c) 55%, transparent), inset 0 1px 0 var(--over-3); }

/* ---------- options ---------- */
.set-card { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.lbl { font: 700 11.5px "Manrope"; letter-spacing: .08em; text-transform: uppercase; color: var(--text-low); margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { padding: 10px 16px; border-radius: 14px; background: var(--over-1); box-shadow: inset 0 0 0 1px var(--over-2); font-weight: 800; font-size: 13.5px; transition: box-shadow .2s, background .2s, transform .15s; }
.opt:hover { background: var(--over-2); } .opt:active { transform: scale(.95); }
.opt.on { background: linear-gradient(135deg, rgba(var(--glow),.26), rgba(255,77,157,.10)); box-shadow: inset 0 0 0 2px var(--g2); }
.row { display: flex; gap: 8px; align-items: center; }
.row .field { height: 42px; font-size: 13px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; cursor: pointer; }
.switch-row small { display: block; color: var(--text-low); font-weight: 500; font-size: 12px; }
.switch { width: 50px; height: 30px; border-radius: 30px; background: var(--over-2); position: relative; flex: none; transition: background .25s; box-shadow: inset 0 0 0 1px var(--over-1); }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #D6D0F2); box-shadow: 0 3px 8px rgba(0,0,0,.35); transition: transform .25s cubic-bezier(.3,1.5,.6,1); }
.switch.on { background: linear-gradient(100deg, var(--g1), var(--g2)); box-shadow: 0 0 14px -2px rgba(var(--glow),.7); }
.switch.on::after { transform: translateX(20px); }

/* ---------- job ---------- */
.job { padding: 18px; display: flex; gap: 16px; align-items: center; animation: pageIn .35s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } }
.ring { width: 68px; height: 68px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font: 700 14px "Unbounded"; }
.ring.spin svg { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(270deg); } }
.job-info { flex: 1; min-width: 0; }
.job-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-stage { color: var(--text-mid); font-size: 13px; margin-top: 2px; }
.bar { height: 8px; border-radius: 8px; background: var(--over-1); margin-top: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--over-1); }
.bar i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); box-shadow: 0 0 12px rgba(var(--glow),.6); transition: width .3s; }
.job.err { box-shadow: 0 14px 40px -10px var(--shadow), 0 0 0 1.5px var(--red); }
.job.ok { box-shadow: 0 14px 40px -10px var(--shadow), 0 0 0 1.5px var(--mint); }

/* ---------- history ---------- */
.hist { flex: 1; min-height: 0; padding: 18px 18px 8px; display: flex; flex-direction: column; }
.hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.hist-head b { font: 700 15px "Unbounded", sans-serif; }
.list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px; background: var(--over-1); box-shadow: inset 0 0 0 1px var(--over-1); animation: pageIn .3s ease; }
.item .orb { width: 40px; height: 40px; }
.item-t { flex: 1; min-width: 0; cursor: pointer; }
.item-t b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-t small { color: var(--text-low); font-size: 12px; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-mid); padding: 20px; }
.empty b { display: block; font: 700 17px "Unbounded"; color: var(--text-hi); margin-bottom: 6px; }
.empty .stack { margin: 0 auto 6px; transform: scale(.75); opacity: .75; }

.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(5,4,12,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; place-items: center; }
.scrim.show { display: grid; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(440px, 92vw); padding: 24px; background: var(--sheet); }
.dialog h3 { margin: 0 0 8px; font: 700 18px "Unbounded"; }
.dialog p { margin: 0 0 6px; color: var(--text-mid); }
.dialog .row2 { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.toast { padding: 14px 18px; max-width: 420px; border-radius: 18px; background: var(--sheet); box-shadow: 0 16px 40px -8px var(--shadow), inset 0 0 0 1px var(--over-2); display: flex; gap: 12px; align-items: center; animation: toastIn .35s cubic-bezier(.3,1.4,.6,1); }
.toast .orb { width: 30px; height: 30px; }
.toast.out { opacity: 0; transform: translateX(20px); transition: .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.toast b { display: block; } .toast small { color: var(--text-mid); }

body.busy .aurora i, body.busy .stack .slab { animation-play-state: paused; }
body.busy .glass { backdrop-filter: none; -webkit-backdrop-filter: none; }
@media (max-width: 1040px) { .home { grid-template-columns: 1fr; overflow-y: auto; align-content: start; } .col, .col.left { overflow: visible; min-height: auto; } .scroll { overflow: visible; flex: none; margin-right: 0; padding-right: 0; } .hist { flex: none; min-height: 320px; } }
</style>
</head>
<body class="m-audio">
<div class="aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<div class="app">
  <header class="top">
    <svg class="brand-logo" viewBox="0 0 48 48"><defs>
      <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF7"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4D9D"/></linearGradient>
      <radialGradient id="lg2" cx=".3" cy=".2" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#lg1)"/><rect x="2" y="2" width="44" height="44" rx="14" fill="url(#lg2)"/>
      <path fill="#fff" d="M18.5 9.5v15.2a1.3 1.3 0 0 0 2 1.1l11.6-7.6a1.3 1.3 0 0 0 0-2.2L20.5 8.4a1.3 1.3 0 0 0-2 1.1z"/>
      <path fill="#fff" d="M21.5 30h5v5h4.2L24 42l-6.7-7h4.2z"/>
    </svg>
    <div><div class="brand-name">YouTube<br>Downloader</div></div>
    <div class="brand-sub" style="margin:0 0 0 6px; align-self:flex-end; padding-bottom:3px">Звук и видео без лишнего</div>
    <div class="spacer"></div>
    <div class="theme" id="theme">
      <button data-theme="night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Ночное</button>
      <button data-theme="classic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Классическое</button>
    </div>
  </header>

  <div class="home">
    <div class="col left">
      <div class="scroll">
      <div class="glass hero">
        <div class="hero-top">
          <div class="stack"><i class="slab" style="--i:0"></i><i class="slab" style="--i:1"></i><i class="slab" style="--i:2"></i><div class="ground"></div></div>
          <div>
            <h1 id="heroTitle">Скачайте звук с YouTube</h1>
            <p id="heroSub">Вставьте ссылку на ролик или плейлист — получите MP3 или MP4 в нужном качестве.</p>
          </div>
        </div>
        <div class="yt">
          <input class="field" id="url" placeholder="https://youtu.be/…" spellcheck="false" autocomplete="off">
          <button class="btn btn-glass" id="btnPaste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Вставить</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="modes">
        <button class="glass mode on" data-mode="audio" style="--c: var(--violet)"><span class="orb gem" style="--c: var(--violet)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="17" cy="16" r="3" fill="#fff"/></svg></span><span><b>Аудио</b><small>MP3 до 320 кбит/с</small></span></button>
        <button class="glass mode" data-mode="video" style="--c: var(--coral)"><span class="orb gem" style="--c: var(--coral)"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="m10 9.2 5 2.8-5 2.8z" fill="#7a2410"/></svg></span><span><b>Видео</b><small>MP4 до 1080p и выше</small></span></button>
      </div>

      <div class="glass set-card">
        <div><div class="lbl">Качество</div><div class="seg" id="quality"></div></div>
        <div><div class="lbl">Папка сохранения</div>
          <div class="row"><input class="field" id="outdir" spellcheck="false"><button class="btn btn-glass btn-sm" id="btnBrowse" style="height:42px">Обзор…</button></div></div>
        <div class="switch-row" id="plRow"><span>Скачать весь плейлист</span><span class="switch" id="plSwitch"></span></div>
      </div>

      </div>
      <button class="btn btn-brand btn-big" id="btnGo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span id="goText">Скачать MP3</span></button>
    </div>

    <div class="col">
      <div id="jobBox"></div>
      <div class="glass hist">
        <div class="hist-head"><b>Недавно скачано</b><span style="display:flex;gap:6px"><button class="btn btn-glass btn-sm" id="btnOpenDir">Открыть папку</button><button class="icon-btn" id="btnClear" title="Очистить список"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></span></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"><div class="glass dialog"><h3>Выйти из программы?</h3><p id="exitText">Окно закроется.</p><div class="row2"><button class="btn btn-glass" id="exitNo">Остаться</button><button class="btn btn-brand" id="exitYes">Выйти</button></div></div></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const ICON_AUDIO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6" cy="18" r="3" fill="#fff"/><circle cx="17" cy="16" r="3" fill="#fff"/></svg>';
const ICON_VIDEO = '<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="m10 9.2 5 2.8-5 2.8z" fill="#7a2410"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';

const S = { mode: "audio", quality: { audio: "320 kbps", video: "Лучшее" }, playlist: false, dirs: {}, lists: {}, running: false, theme: "night" };
let api = null;

function applyTheme(t) {
  S.theme = t;
  document.body.classList.toggle("classic", t === "classic");
  document.querySelectorAll("#theme button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
function applyMode() {
  const v = S.mode === "video";
  document.body.classList.toggle("m-video", v);
  document.body.classList.toggle("m-audio", !v);
  document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  $("#heroTitle").textContent = v ? "Скачайте видео с YouTube" : "Скачайте звук с YouTube";
  $("#heroSub").textContent = v ? "Вставьте ссылку на ролик или плейлист — получите MP4 с изображением и звуком." : "Вставьте ссылку на ролик или плейлист — получите MP3 в нужном качестве.";
  $("#goText").textContent = v ? "Скачать MP4" : "Скачать MP3";
  $("#outdir").value = S.dirs[S.mode] || "";
  const q = $("#quality"); q.innerHTML = "";
  (S.lists[S.mode] || []).forEach(name => {
    const b = document.createElement("button");
    b.className = "opt" + (S.quality[S.mode] === name ? " on" : ""); b.textContent = name;
    b.onclick = () => { S.quality[S.mode] = name; applyMode(); };
    q.appendChild(b);
  });
}

function fmtSize(b) { if (!b) return ""; const mb = b / 1048576; return mb >= 1024 ? (mb / 1024).toFixed(1) + " ГБ" : mb.toFixed(mb < 10 ? 1 : 0) + " МБ"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderHistory(items) {
  const list = $("#list");
  if (!items || !items.length) {
    list.innerHTML = '<div class="empty"><div><div class="stack"><i class="slab" style="--i:0"></i><i class="slab" style="--i:1"></i><i class="slab" style="--i:2"></i><div class="ground"></div></div><b>Пока пусто</b>Скачанные файлы появятся здесь — откройте их в один клик.</div></div>';
    return;
  }
  list.innerHTML = "";
  items.forEach(h => {
    const v = h.mode === "video";
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<span class="orb gem" style="--c: var(--${v ? "coral" : "violet"})">${v ? ICON_VIDEO : ICON_AUDIO}</span>
      <div class="item-t"><b>${esc(h.title)}</b><small>${v ? "MP4" : "MP3"}${h.size ? " · " + fmtSize(h.size) : ""}</small></div>
      <button class="icon-btn" data-a="open" title="Открыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg></button>
      <button class="icon-btn" data-a="dir" title="Показать в папке"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>`;
    el.querySelector('[data-a="open"]').onclick = () => api.open_file(h.path);
    el.querySelector('[data-a="dir"]').onclick = () => api.reveal(h.path);
    el.querySelector(".item-t").onclick = () => api.open_file(h.path);
    list.appendChild(el);
  });
}

function toast(kind, title, sub) {
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<span class="orb" style="--c: var(--${kind === "ok" ? "mint" : "red"})">${kind === "ok" ? ICON_OK : ICON_ERR}</span><div><b>${esc(title)}</b><small>${esc(sub || "")}</small></div>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 5200);
}

function ring(p, spin) {
  const R = 28, C = 2 * Math.PI * R, off = C * (1 - Math.min(1, Math.max(0, p)));
  return `<div class="ring ${spin ? "spin" : ""}"><svg viewBox="0 0 68 68"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--g1)"/><stop offset=".5" stop-color="var(--g2)"/><stop offset="1" stop-color="var(--g3)"/></linearGradient></defs>
    <circle cx="34" cy="34" r="${R}" fill="none" stroke="var(--over-2)" stroke-width="7"/>
    <circle cx="34" cy="34" r="${R}" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${spin ? C * 0.72 : off}" style="filter:drop-shadow(0 0 6px rgba(var(--glow),.7))"/></svg>
    ${spin ? "" : `<div class="pct">${Math.round(p * 100)}</div>`}</div>`;
}

function setRunning(r) {
  S.running = r;
  document.body.classList.toggle("busy", r);
  $("#btnGo").disabled = r;
}

function renderJob(j) {
  const box = $("#jobBox");
  if (j.state === "running") {
    const spin = j.stage === "connect" || j.stage === "convert";
    const stage = j.stage === "connect" ? "Подключение к YouTube…" :
      j.stage === "convert" ? "Обработка (ffmpeg)…" : `Скачивание… ${Math.round((j.pct || 0) * 100)}%${j.detail ? " · " + j.detail : ""}`;
    box.innerHTML = `<div class="glass job">${ring(j.pct || 0, spin)}<div class="job-info"><div class="job-name">${esc(j.title || "Загрузка")}</div><div class="job-stage">${stage}</div><div class="bar"><i style="width:${Math.round((j.pct || 0) * 100)}%"></i></div></div><button class="btn btn-glass btn-sm" id="btnCancel">Отменить</button></div>`;
    $("#btnCancel").onclick = () => api.cancel();
  }
}

async function poll() {
  if (!api) return;
  let j; try { j = await api.poll(); } catch (e) { return; }
  if (j.state === "running") { if (!S.running) setRunning(true); renderJob(j); return; }
  if (j.state === "idle") return;
  setRunning(false);
  const box = $("#jobBox");
  if (j.state === "done") {
    const n = j.count || 1;
    box.innerHTML = `<div class="glass job ok"><span class="orb" style="--c: var(--mint); width:56px;height:56px">${ICON_OK}</span><div class="job-info"><div class="job-name">Готово</div><div class="job-stage">${esc(n > 1 ? n + " файлов сохранено" : (j.title || "Файл сохранён"))}</div></div><button class="btn btn-glass btn-sm" id="btnShow">Показать</button></div>`;
    $("#btnShow").onclick = () => api.reveal(j.path);
    renderHistory(j.history);
    toast("ok", "Готово", j.title || "");
  } else if (j.state === "error") {
    box.innerHTML = `<div class="glass job err"><span class="orb" style="--c: var(--red); width:56px;height:56px">${ICON_ERR}</span><div class="job-info"><div class="job-name">Не получилось</div><div class="job-stage" style="user-select:text">${esc(j.error || "")}</div></div></div>`;
  } else if (j.state === "cancelled") {
    box.innerHTML = "";
    toast("err", "Отменено", "");
  }
}

async function go() {
  if (S.running) return;
  const url = $("#url").value.trim();
  if (!/^https?:\/\//i.test(url)) {
    const f = $("#url"); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); f.focus();
    $("#hint").textContent = "Вставьте ссылку на видео, она начинается с http…"; return;
  }
  $("#hint").textContent = "";
  const r = await api.start(url, S.mode, S.quality[S.mode], S.playlist, $("#outdir").value);
  if (!r.ok) {
    $("#jobBox").innerHTML = `<div class="glass job err"><span class="orb" style="--c: var(--red); width:56px;height:56px">${ICON_ERR}</span><div class="job-info"><div class="job-name">Не получилось</div><div class="job-stage">${esc(r.error)}</div></div></div>`;
    return;
  }
  setRunning(true);
  renderJob({ state: "running", stage: "connect", pct: 0 });
}

async function init() {
  api = window.pywebview.api;
  const st = await api.get_state();
  S.dirs = st.dirs; S.lists = { audio: st.audio_q, video: st.video_q };
  S.quality = { audio: st.audio_q[0], video: st.video_q[0] };
  S.mode = st.mode || "audio";
  if (st.platform === "mac") { $("#btnOpenDir").textContent = "Открыть в Finder"; document.body.classList.add("mac"); }
  applyTheme(st.theme); applyMode(); renderHistory(st.history);
  document.querySelectorAll("#theme button").forEach(b => b.onclick = () => { applyTheme(b.dataset.theme); api.set_theme(b.dataset.theme); });
  document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
    S.dirs[S.mode] = $("#outdir").value; S.mode = b.dataset.mode; applyMode(); api.set_mode(S.mode);
  });
  $("#plRow").onclick = () => { S.playlist = !S.playlist; $("#plSwitch").classList.toggle("on", S.playlist); };
  $("#btnPaste").onclick = async () => { const t = await api.paste(); if (t) { $("#url").value = t; $("#hint").textContent = ""; } };
  $("#btnBrowse").onclick = async () => { const d = await api.pick_folder($("#outdir").value); if (d) { $("#outdir").value = d; S.dirs[S.mode] = d; } };
  $("#btnOpenDir").onclick = () => api.open_folder($("#outdir").value);
  $("#btnClear").onclick = async () => { await api.clear_history(); renderHistory([]); };
  $("#btnGo").onclick = go;
  $("#url").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("#url").focus();
  setInterval(poll, 350);
}
// Called by the Chrome extension bridge (local server in yt_downloader.py).
window.extDownload = (url, mode) => {
  if (S.running || !api) return "busy";
  mode = mode === "video" ? "video" : "audio";
  if (mode !== S.mode) { S.dirs[S.mode] = $("#outdir").value; S.mode = mode; applyMode(); api.set_mode(mode); }
  S.playlist = false; $("#plSwitch").classList.remove("on");
  $("#url").value = url; go();
  return "ok";
};
window.askExit = () => {
  $("#exitText").textContent = S.running ? "Идёт загрузка — она будет прервана." : "Окно закроется.";
  $("#scrim").classList.add("show");
};
document.addEventListener("DOMContentLoaded", () => {
  $("#exitNo").onclick = () => $("#scrim").classList.remove("show");
  $("#exitYes").onclick = () => api.exit_app();
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("#scrim").classList.remove("show"); });
});
window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
