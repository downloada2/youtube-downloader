<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;width:280px;padding:16px;background:#0d0a1f;color:#fff;font:14px/1.4 system-ui,Segoe UI,sans-serif}
  h1{font-size:15px;margin:0 0 4px}
  p{margin:0 0 12px;opacity:.7;font-size:12.5px}
  .row{display:flex;gap:8px}
  button{all:unset;cursor:pointer;flex:1;text-align:center;padding:11px 0;border-radius:12px;font-weight:700}
  .a{background:linear-gradient(135deg,#6366f1,#a855f7 60%,#ec4899)}
  .v{background:linear-gradient(135deg,#f43f5e,#fb923c)}
  button:hover{filter:brightness(1.12)}
  #st{margin-top:12px;font-size:12.5px;min-height:16px}
  .ok{color:#6ee7b7}.bad{color:#fda4af}
</style>
<h1>YouTube Downloader</h1>
<p id="state">Проверяю программу…</p>
<div class="row"><button class="a" data-m="audio">⬇ MP3</button><button class="v" data-m="video">⬇ MP4</button></div>
<div id="st"></div>
<script src="popup.js"></script>
